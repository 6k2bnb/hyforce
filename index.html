        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Sora:wght@600;700;800&display=swap');
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; }
        .hy-root {
          background: #050A14;
          color: #E6EEFF;
          min-height: 100vh;
          font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased;
          padding-top: var(--safe-area-inset-top);
          box-sizing: border-box;
          overflow-x: clip;
        }
        .hy-shell {
          width: 100%;
          max-width: 1280px;
          margin: 0 auto;
          overflow: hidden;
          padding: 0 24px;
          box-sizing: border-box;
        }
        .hy-card {
          position: relative;
          overflow: hidden;
          border-radius: 20px;
          background: #0F1A33;
          border: 1px solid rgba(255,255,255,0.1);
          padding: 24px;
          box-sizing: border-box;
          text-align: left;
        }
        .hy-num-row {
          display: flex;
          gap: 16px;
          align-items: flex-start;
          width: 100%;
          max-width: 100%;
          overflow: hidden;
          box-sizing: border-box;
        }
        .hy-num {
          width: 40px;
          height: 40px;
          min-width: 40px;
          border-radius: 50%;
          background: #0A1A3A;
          color: #00A8FF;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 900;
          font-size: 14px;
          font-family: "Sora", monospace;
          flex-shrink: 0;
          border: 1px solid rgba(0,168,255,0.25);
        }
        .hy-text {
          flex: 1;
          min-width: 0;
          word-break: keep-all;
          overflow-wrap: break-word;
          line-height: 1.6;
          text-align: left;
        }
        .hy-img {
          width: 100%;
          max-width: 100%;
          height: auto;
          object-fit: contain;
          border-radius: 14px;
          display: block;
          margin: 12px 0;
          background: #081126;
        }
        .hy-grid-2 {
